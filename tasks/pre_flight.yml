---
- name: Determine OS support
  ansible.builtin.set_fact:
    rancherk8s_os_supported: "{{ is_rhel or is_ubuntu }}"
  vars:
    major: "{{ ansible_distribution_major_version | int }}"
    is_rhel: "{{ ansible_facts['os_family'] == 'RedHat' and major >= 9 }}"
    is_ubuntu: "{{ ansible_facts['distribution'] == 'Ubuntu' and major >= 22 }}"

- name: Explain why an unsupported OS ends the play
  ansible.builtin.debug:
    msg: >-
      {{ ansible_facts['distribution'] }}
      {{ ansible_distribution_major_version }} is not supported - this role
      requires RHEL-family 9+ or Ubuntu 22.04+ LTS.
  when: not rancherk8s_os_supported

- name: End the play for hosts with an unsupported OS
  ansible.builtin.meta: end_play
  when: not rancherk8s_os_supported

- name: Warn about SELinux and the rke2 tarball install method
  ansible.builtin.debug:
    msg: >-
      SELinux is enforcing: this role always installs rke2 as a plain
      binary, so the rke2-selinux policy is not pulled in automatically.
      Provision it yourself (e.g. via a base image) before running this role.
  when:
    - rancherk8s_type == 'rke2'
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['selinux']['status'] | default('') == 'enabled'
    - ansible_facts['selinux']['mode'] | default('') == 'enforcing'

- name: Gather service facts
  ansible.builtin.service_facts:

- name: 'Check for binary {{ rancherk8s_type }}'
  ansible.builtin.stat:
    path: "{{ '/usr/bin/rke2' if rancherk8s_type == 'rke2' else '/usr/local/bin/k3s' }}"
  register: rancherk8s_bin

- name: 'Add node to group {{ rancherk8s_type }}'
  ansible.builtin.add_host:
    name: "{{ item | string }}"
    groups: '{{ rancherk8s_type }}'
  with_items: "{{ ansible_play_hosts }}"
  changed_when: false

- name: 'Display groups the host is part of to check if its member of {{ rancherk8s_type }}'
  ansible.builtin.debug:
    msg: "Host {{ inventory_hostname }} is part of group(s): {{ group_names | join(', ') }}"

- name: Create dynamic groups
  ansible.builtin.include_tasks: pre_flight/groups.yml

- name: Check existing and defined verisons
  ansible.builtin.include_tasks: pre_flight/versions.yml
  when:
    - inventory_hostname in groups['server_primary']

- name: Check for existing node-token
  ansible.builtin.include_tasks: pre_flight/tokens.yml
  when:
    - inventory_hostname in groups['server_primary']
