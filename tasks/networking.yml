- name: Install networking defaults
  ansible.builtin.include_tasks: networking/cni-default.yml

- name: Restart k8s
  ansible.builtin.meta: flush_handlers

- name: Install Cilium
  when:
    - "'server_primary' in group_names"
    - rancherk8s_type == 'k3s'
    - rancherk8s_cni == 'cilium'
  ansible.builtin.include_tasks: networking/cilium.yml
