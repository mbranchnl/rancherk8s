- name: Check if Cilium CLI is already installed
  ansible.builtin.command: cilium version --client
  register: current_cilium_version
  failed_when: false
  changed_when: false

- name: Get latest Cilium CLI version
  ansible.builtin.uri:
    url: https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt
    return_content: true
  register: rancherk8s_cilium_cli_version

- name: Auto upgrade Cilium
  when: rancherk8s_cni_cilium_autoupgrade
  block:
    - name: Autoupdate - Get latest Cilium version
      ansible.builtin.uri:
        url: https://raw.githubusercontent.com/cilium/cilium/main/stable.txt
        return_content: true
      register: rancherk8s_cilium_version

    - name: Autoupdate - Determine if installation/upgrade is needed
      ansible.builtin.set_fact:
        needs_install: "{{ not cilium_installed or (current_version != cilium_version) }}"
      vars:
        cilium_version: "{{ rancherk8s_cilium_version.content | trim }}"
        cilium_installed: "{{ current_cilium_version.rc == 0 }}"
        current_version: "{{ (current_cilium_version.stdout | regex_findall('cilium image (stable): (v?[0-9.]+)') | first) | default('') }}"

    - name: Autoupdate - Set news version
      ansible.builtin.set_fact:
        rancherk8s_cni_cilium_version: "{{ rancherk8s_cilium_version.content | trim | regex_replace('^v', '') }}"

# Helm is required here but tools.yml only runs after networking.yml
- name: Ensure helm is installed
  ansible.builtin.include_tasks: tools/helm.yml

- name: "Install Cilium helm chart {{ rancherk8s_cni_cilium_version }}"
  block:
    - name: Add cilium chart repo
      kubernetes.core.helm_repository:
        name: cilium
        repo_url: "https://helm.cilium.io"

    - name: Install cilium using Helm
      kubernetes.core.helm:
        name: cilium
        chart_ref: cilium/cilium
        chart_version: "{{ rancherk8s_cni_cilium_version }}"
        update_repo_cache: true
        release_namespace: kube-system
        kubeconfig: '{{ rancherk8s_kubeconfig }}'
        reuse_values: true
        values:
          # devices: "{{ ansible_default_ipv4.interface }}"
          k8sServiceHost: "127.0.0.1"
          k8sServicePort: 6443
          # nodePort:
          #   directRoutingDevice: "{{ ansible_default_ipv4.interface }}"
          l2announcements:
            enabled: true
          ipam:
            operator:
              clusterPoolIPv4PodCIDRList:
                - "10.42.0.0/16"
          operator:
            replicas: "{{ rancherk8s_cni_operator_replicas }}"
            rollOutPods: true
          kubeProxyReplacement: true
          envoy:
            enabled: true
            securityContext:
              capabilities:
                envoy:
                  - BPF
                  - CAP_NET_ADMIN
                  - CAP_SYS_ADMIN
                  - NET_ADMIN
                  - NET_BIND_SERVICE
                  - SYS_ADMIN
                keepCapNetBindService: true
        state: present
