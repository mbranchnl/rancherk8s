---
# rancherk8s_active_node: real target node - inventory_hostname stays on the driver when delegated.
- name: Resolve the node actually being acted on
  ansible.builtin.set_fact:
    rancherk8s_active_node: "{{ rancherk8s_upgrade_target | default(inventory_hostname) }}"

- name: 'Download install.sh from {{ rancherk8s_type }}.io'  # noqa name[template]
  ansible.builtin.get_url:
    url: https://get.{{ rancherk8s_type }}.io/
    dest: "{{ rancherk8s_artifact_path }}/install.sh"
    mode: '0755'
  delegate_to: "{{ rancherk8s_active_node }}"

- name: 'Render install environment for {{ rancherk8s_type }}'
  ansible.builtin.template:
    src: install.env.j2
    dest: "{{ rancherk8s_artifact_path }}/install.env"
    mode: '0600'
  delegate_to: "{{ rancherk8s_active_node }}"

- name: 'Run installer for {{ rancherk8s_type }}' # noqa command-instead-of-shell no-changed-when
  ansible.builtin.shell:
    cmd: "set -a && . {{ rancherk8s_artifact_path }}/install.env && set +a && {{ rancherk8s_artifact_path }}/install.sh"
  delegate_to: "{{ rancherk8s_active_node }}"

- name: 'Set config-file for {{ rancherk8s_type }}'
  ansible.builtin.template:
    src: config.yml.j2
    dest: '/etc/rancher/{{ rancherk8s_type }}/config.yaml'
    mode: '0644'
  no_log: true  # contains the join token and, optionally, S3 backup credentials
  delegate_to: "{{ rancherk8s_active_node }}"

- name: 'Start and enable service on primary node only for {{ rancherk8s_type }}'
  ansible.builtin.service:
    name: "{{ rancherk8s_service_name }}"
    enabled: true
    state: started
  vars:
    # Service name: "k3s" for a k3s server, else "<type>-<node_type>".
    rancherk8s_service_name: >-
      {{ 'k3s' if rancherk8s_type == 'k3s' and hostvars[rancherk8s_active_node].rancherk8s_node_type == 'server'
         else rancherk8s_type + '-' + hostvars[rancherk8s_active_node].rancherk8s_node_type }}
  delegate_to: "{{ rancherk8s_active_node }}"

- name: Wait for kubernetes API to become available on server
  ansible.builtin.wait_for:
    port: 6443
    timeout: 600
    delay: 10
  register: rancherk8s_api_check
  delegate_to: "{{ rancherk8s_active_node }}"
