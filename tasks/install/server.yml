---
- name: 'Download install.sh from {{ rancherk8s_type }}.io'  # noqa name[template]
  ansible.builtin.get_url:
    url: https://get.{{ rancherk8s_type }}.io/
    dest: "{{ rancherk8s_artifact_path }}/install.sh"
    mode: '0755'

- name: Set dynamic environment variables
  ansible.builtin.set_fact:
    installer_env: "{{ dict(env_keys | zip(env_values)) }}"
  vars:
    # RKE2's installer picks server/agent via INSTALL_RKE2_TYPE; k3s's via
    # INSTALL_K3S_EXEC (INSTALL_K3S_TYPE only sets the systemd unit's Type=).
    rancherk8s_install_type_key: "{{ 'INSTALL_RKE2_TYPE' if rancherk8s_type == 'rke2' else 'INSTALL_K3S_EXEC' }}"
    env_keys:
      - "INSTALL_{{ rancherk8s_type | upper }}_VERSION"
      - "{{ rancherk8s_install_type_key }}"
    env_values:
      - "{{ rancherk8s_version }}"
      - "{{ rancherk8s_node_type }}"

- name: 'Run installer for {{ rancherk8s_type }}' # noqa command-instead-of-shell no-changed-when
  ansible.builtin.shell:
    cmd: "{{ rancherk8s_artifact_path }}/install.sh"
  environment: "{{ installer_env }}"

- name: 'Set config-file for {{ rancherk8s_type }}'
  ansible.builtin.template:
    src: config.yml.j2
    dest: '/etc/rancher/{{ rancherk8s_type }}/config.yaml'
    mode: '0644'

- name: 'Start and enable service on primary node only for {{ rancherk8s_type }}'
  ansible.builtin.service:
    name: "{{ rancherk8s_service_name }}"
    enabled: true
    state: started
  when: inventory_hostname in groups['server_primary']
  vars:
    # k3s server keeps the plain "k3s" unit name; every other combination
    # (k3s agent, rke2 server/agent) is "<type>-<node_type>".
    rancherk8s_service_name: >-
      {{ 'k3s' if rancherk8s_type == 'k3s' and rancherk8s_node_type == 'server'
         else rancherk8s_type + '-' + rancherk8s_node_type }}

- name: Wait for kubernetes API to become available on server
  ansible.builtin.wait_for:
    port: 6443
    timeout: 600
    delay: 10
  register: rancherk8s_api_check
  when:
    - inventory_hostname in groups['server_primary']

- name: "Can't connect to rke2-api end play"
  ansible.builtin.meta: end_play
  when:
    - inventory_hostname in groups['server_primary']
    - rancherk8s_api_check.failed

- name: Wait for kubernetes API to become ready
  ansible.builtin.uri:
    url: https://127.0.0.1:6443/readyz
    validate_certs: false
    client_cert: "/var/lib/rancher/{{ rancherk8s_type }}/server/tls/client-admin.crt"
    client_key: "/var/lib/rancher/{{ rancherk8s_type }}/server/tls/client-admin.key"
    status_code: 200
  register: rancherk8s_api_ready
  until: rancherk8s_api_ready.status == 200
  retries: 60
  delay: 5
  when:
    - inventory_hostname in groups['server_primary']

- name: Set node-token path
  when: rancherk8s_type == 'rke2'
  ansible.builtin.set_fact:
    rancherk8s_node_token: "/var/lib/rancher/{{ rancherk8s_type }}/server/node-token"

- name: Set node-token path
  when: rancherk8s_type == 'k3s'
  ansible.builtin.set_fact:
    rancherk8s_node_token: "/var/lib/rancher/{{ rancherk8s_type }}/server/agent-token"

- name: Wait for node-token
  ansible.builtin.wait_for:
    path: '{{ rancherk8s_node_token }}'
    timeout: 30

- name: Read and register node-token from first server
  ansible.builtin.slurp:
    src: '{{ rancherk8s_node_token }}'
  register: node_token
