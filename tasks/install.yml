---
- name: Append kubectl binary dir to global PATH
  ansible.builtin.lineinfile:
    path: /etc/profile.d/k8s_exports.sh
    line: "{{ item }}"
    mode: '0644'
    create: true
  loop:
    - 'export PATH="$PATH:/var/lib/rancher/{{ rancherk8s_type }}/bin"'
    - 'export KUBECONFIG={{ rancherk8s_kubeconfig }}'

- name: "Create rancherk8s_kubeconfig dir"
  ansible.builtin.file:
    path: "{{ rancherk8s_kubeconfig | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: 'Start installation server node for {{ rancherk8s_type }}'
  ansible.builtin.include_tasks: install/server.yml
  when:
    - "'server_primary' in group_names"

# Must run before secondary servers join below: they join through
# rancherk8s_api_endpoint, so the VIP has to already be answering.
- name: Deploy kube-vip for the control-plane API endpoint
  ansible.builtin.include_tasks: networking/kube-vip.yml
  when:
    - "'server_primary' in group_names"
    - rancherk8s_api_vip_enabled

- name: Wait for the kube-vip control-plane endpoint to become reachable
  ansible.builtin.wait_for:
    host: "{{ rancherk8s_api_endpoint }}"
    port: 6443
    timeout: 60
  when:
    - "'server_primary' in group_names"
    - rancherk8s_api_vip_enabled

- name: 'Start installation agent node for {{ rancherk8s_type }}'
  ansible.builtin.include_tasks: install/agent.yml
  when:
    - "'agent' in group_names"

- name: Store node-token
  ansible.builtin.set_fact:
    rancherk8s_token: "{{ hostvars[groups['server_primary'][0]]['node_token'].content | b64decode | regex_replace('\n', '') }}"

- name: Join secondary servers to the cluster, one at a time
  # throttle silently doesn't serialize block+include_tasks - loop from primary instead.
  ansible.builtin.include_tasks: install/cluster.yml
  loop: "{{ groups['server_secondary'] | default([]) }}"
  loop_control:
    loop_var: rancherk8s_upgrade_target
  when: inventory_hostname == groups['server_primary'][0]

- name: Set RKE2 login-file permissions
  when: rancherk8s_type == 'rke2'
  ansible.builtin.copy:
    src: "/etc/rancher/rke2/rke2.yaml"
    dest: "{{ rancherk8s_kubeconfig }}"
    mode: '0644'
    remote_src: true
