---
- name: Select the resource floor for this node's role
  ansible.builtin.set_fact:
    rancherk8s_min_cpu_cores_floor: >-
      {{ rancherk8s_control_plane_only_min_cpu_cores
         if (rancherk8s_node_type == 'server' and not rancherk8s_server_schedulable)
         else rancherk8s_min_cpu_cores }}
    rancherk8s_min_memory_mb_floor: >-
      {{ rancherk8s_control_plane_only_min_memory_mb
         if (rancherk8s_node_type == 'server' and not rancherk8s_server_schedulable)
         else rancherk8s_min_memory_mb }}

- name: Require minimum CPU cores
  ansible.builtin.assert:
    that:
      - ansible_facts['processor_vcpus'] | int >= rancherk8s_min_cpu_cores_floor | int
    fail_msg: >-
      {{ inventory_hostname }} has {{ ansible_facts['processor_vcpus'] }}
      CPU core(s), but the minimum for this node is
      {{ rancherk8s_min_cpu_cores_floor }}.
    success_msg: >-
      {{ inventory_hostname }} has {{ ansible_facts['processor_vcpus'] }}
      CPU core(s), meeting the minimum of {{ rancherk8s_min_cpu_cores_floor }}.

- name: Compute effective minimum memory including allowed margin
  ansible.builtin.set_fact:
    rancherk8s_min_memory_mb_effective: >-
      {{ (rancherk8s_min_memory_mb_floor | int * (100 - rancherk8s_min_memory_margin_percent) / 100) | round | int }}

- name: Require minimum memory
  ansible.builtin.assert:
    that:
      - ansible_facts['memtotal_mb'] | int >= rancherk8s_min_memory_mb_effective | int
    fail_msg: >-
      {{ inventory_hostname }} has {{ ansible_facts['memtotal_mb'] }}MB of
      memory, but the minimum for this node is {{ rancherk8s_min_memory_mb_floor }}MB
      (minimum {{ rancherk8s_min_memory_mb_effective }}MB with a
      {{ rancherk8s_min_memory_margin_percent }}% margin).
    success_msg: >-
      {{ inventory_hostname }} has {{ ansible_facts['memtotal_mb'] }}MB of
      memory, meeting the minimum of {{ rancherk8s_min_memory_mb_effective }}MB
      ({{ rancherk8s_min_memory_mb_floor }}MB with a
      {{ rancherk8s_min_memory_margin_percent }}% margin).
