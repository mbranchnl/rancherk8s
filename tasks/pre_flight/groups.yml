---
# Created block because include_tasks doesn't allow delegate_to
- name: Organize nodes in the correct groups
  delegate_to: "localhost"
  block:
    - name: Add node to group server when rancherk8s_node_type defined is server
      ansible.builtin.add_host:
        name: "{{ item | string }}"
        groups: server
      when: hostvars[item].rancherk8s_node_type == "server"
      loop: "{{ groups[rancherk8s_type] }}"
      changed_when: false

    - name: Add node to group agent when rancherk8s_node_type is agent
      ansible.builtin.add_host:
        name: "{{ item | string }}"
        groups: agent
      when: hostvars[item].rancherk8s_node_type == "agent"
      loop: "{{ groups[rancherk8s_type] }}"
      changed_when: false

    - name: Add first servernode to primary group
      ansible.builtin.add_host:
        name: "{{ hostvars[groups['server'][0]].inventory_hostname | string }}"
        groups: server_primary
      when: groups['server'] | length > 0
      changed_when: false

    - name: Add other servers to secondary group when more than 1 server
      ansible.builtin.add_host:
        name: "{{ hostvars[item].inventory_hostname | string }}"
        groups: server_secondary
      loop: "{{ groups.server[1:] }}"
      changed_when: false

    - name: Display groups the host is part of
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }} is part of group(s): {{ group_names | join(', ') }}"

    - name: End play if odd amount of servers is provisioned
      ansible.builtin.meta: end_host
      when: groups['server'] | length | int is even

    - name: Require an explicit API endpoint for multi-server (HA) clusters
      ansible.builtin.assert:
        that:
          - rancherk8s_api_endpoint | length > 0
        fail_msg: >-
          {{ groups['server'] | length }} server nodes were provisioned but
          rancherk8s_api_endpoint is unset. Set it to a kube-vip VIP (with
          rancherk8s_api_vip_enabled: true) or to an externally managed load
          balancer address before deploying a multi-server cluster.
      when: groups['server'] | length > 1
      run_once: true
