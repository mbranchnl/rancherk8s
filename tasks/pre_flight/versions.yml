---
- name: "Check if {{ rancherk8s_type }} installed and register installed version"  # noqa name[template] risky-shell-pipe
  ansible.builtin.shell: |
    set -o pipefail
    {{ rancherk8s_type }} -v | grep {{ rancherk8s_type }} | awk '{print $3}'
  register: gathered_installed_version
  changed_when: false
  when:
    - rancherk8s_bin.stat.exists

- name: Set fact for installed and defined versions
  ansible.builtin.set_fact:
    rancherk8s_version_defined: "{{ rancherk8s_version }}"
    # Nothing installed yet this run - it's about to be installed at rancherk8s_version, so there's nothing to upgrade.
    rancherk8s_version_installed: "{{ gathered_installed_version.stdout if rancherk8s_bin.stat.exists else rancherk8s_version }}"

- name: End play when rancherk8s_version_installed is newer than rancherk8s_version_defined
  ansible.builtin.meta: end_play
  when: rancherk8s_version_defined is version(rancherk8s_version_installed, '<')
