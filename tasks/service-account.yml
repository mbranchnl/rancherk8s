---
- name: "Create ClusterRoleBinding"
  kubernetes.core.k8s:
    namespace: kube-system
    state: present
    template: 'service-account/clusterrolebinding.yml.j2'
    kubeconfig: '{{ rancherk8s_kubeconfig }}'

- name: Create sa-account
  block:
    - name: "Create sa-{{ rancherk8s_service_account }} and token"  # noqa name[template]
      kubernetes.core.k8s:
        namespace: kube-system
        state: present
        template: 'service-account/user.yml.j2'
        kubeconfig: '{{ rancherk8s_kubeconfig }}'
      register: rancherk8s_sa

- name: "Gather token for sa-{{ rancherk8s_service_account }}"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: kube-system
    name: "sa-{{ rancherk8s_service_account }}-token"
    kubeconfig: '{{ rancherk8s_kubeconfig }}'
  register: rancherk8s_sa_token
  # Retry: the token controller populates .data.token asynchronously.
  until: >-
    rancherk8s_sa_token.resources | length > 0 and
    'token' in rancherk8s_sa_token.resources[0].get('data', {})
  retries: 30
  delay: 2
