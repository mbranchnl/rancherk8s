- name: Download kube-config
  ansible.builtin.include_tasks: tools/kubeconfig.yml
  when:
    - "'server_primary' in group_names"
    - rancherk8s_fetch_kubeconfig

- name: Install helm
  ansible.builtin.include_tasks: tools/helm.yml

- name: Install k9s
  ansible.builtin.include_tasks: tools/k9s.yml

- name: Install Cilium CLI
  when:
    - rancherk8s_type == 'k3s'
    - rancherk8s_cni == 'cilium'
  ansible.builtin.include_tasks: tools/cilium.yml
