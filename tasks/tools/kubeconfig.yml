---
- name: Fetch kubeconfig
  ansible.builtin.fetch:
    src: "/etc/rancher/rke2/rke2.yaml"
    dest: "{{ role_path }}/files/kubeconfig.yml"
    flat: true
  when:
    - "'rke2_server_primary' in group_names"

- name: "Replace localhost IP with {{ ansible_default_ipv4.address }}"
  ansible.builtin.replace:
    path: "{{ role_path }}/files/kubeconfig.yml"
    regexp: '127.0.0.1'
    replace: "{{ ansible_default_ipv4.address }}"
  delegate_to: localhost

- name: Replace 'default' with server hostname
  ansible.builtin.replace:
    path: "{{ role_path }}/files/kubeconfig.yml"
    regexp: 'default'
    replace: "{{ inventory_hostname.split('.')[0] }}"
  delegate_to: localhost

- name: Move kubeconfig to ~/.kube/config  # noqa no-changed-when
  ansible.builtin.command: "mv {{ role_path }}/files/kubeconfig.yml {{ ansible_env.HOME }}/.kube/{{ inventory_hostname.split('.')[0] }}.yml"
  delegate_to: localhost
  changed_when: false
