---
# Fetched to a per-host temp name so concurrent runs against different
# clusters from the same control machine don't collide on the same file.
- name: Set kubeconfig fetch path fact
  ansible.builtin.set_fact:
    rancherk8s_kubeconfig_fetch_path: >-
      {{ role_path }}/files/kubeconfig-{{ inventory_hostname }}.yml

- name: Fetch kubeconfig
  ansible.builtin.fetch:
    src: "/etc/rancher/{{ rancherk8s_type }}/{{ rancherk8s_type }}.yaml"
    dest: "{{ rancherk8s_kubeconfig_fetch_path }}"
    flat: true
  changed_when: false
  when:
    - "'server_primary' in group_names"

- name: "Replace localhost IP with the control-plane endpoint"
  ansible.builtin.replace:
    path: "{{ rancherk8s_kubeconfig_fetch_path }}"
    regexp: '127.0.0.1'
    replace: "{{ rancherk8s_api_endpoint or rancherk8s_own_ip }}"
  changed_when: false
  delegate_to: localhost
  vars:
    rancherk8s_own_ip: "{{ ansible_facts['default_ipv4']['address'] }}"

- name: Replace 'default' with server hostname
  ansible.builtin.replace:
    path: "{{ rancherk8s_kubeconfig_fetch_path }}"
    regexp: 'default'
    replace: "{{ inventory_hostname.split('.')[0] }}"
  changed_when: false
  delegate_to: localhost

- name: Move kubeconfig to ~/.kube/config  # noqa no-changed-when
  ansible.builtin.command: "mv {{ rancherk8s_kubeconfig_fetch_path }} {{ lookup('env', 'HOME') }}/.kube/{{ inventory_hostname.split('.')[0] }}.yml"
  changed_when: false
  delegate_to: localhost
