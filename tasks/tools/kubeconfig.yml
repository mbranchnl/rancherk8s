---
- name: Fetch kubeconfig
  ansible.builtin.fetch:
    src: "/etc/rancher/{{ rancherk8s_type }}/{{ rancherk8s_type }}.yaml"
    dest: "{{ role_path }}/files/kubeconfig.yml"
    flat: true
  changed_when: false
  when:
    - "'server_primary' in group_names"

- name: "Replace localhost IP with {{ ansible_default_ipv4.address }}"
  ansible.builtin.replace:
    path: "{{ role_path }}/files/kubeconfig.yml"
    regexp: '127.0.0.1'
    replace: "{{ ansible_default_ipv4.address }}"
  changed_when: false
  delegate_to: localhost

- name: Replace 'default' with server hostname
  ansible.builtin.replace:
    path: "{{ role_path }}/files/kubeconfig.yml"
    regexp: 'default'
    replace: "{{ inventory_hostname.split('.')[0] }}"
  changed_when: false
  delegate_to: localhost

- name: Move kubeconfig to ~/.kube/config  # noqa no-changed-when
  ansible.builtin.command: "mv {{ role_path }}/files/kubeconfig.yml {{ lookup('env', 'HOME') }}/.kube/{{ inventory_hostname.split('.')[0] }}.yml"
  changed_when: false
  delegate_to: localhost
