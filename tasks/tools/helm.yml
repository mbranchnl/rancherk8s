---
# Ansible tasks to install Helm on Rocky Linux
# Installs rancherk8s_helm_version when set, otherwise the latest release
- name: Install Helm on Rocky Linux systems
  block:
    - name: Check if Helm is already installed
      ansible.builtin.command: helm version --short
      register: rancherk8s_helm_version_check
      failed_when: false
      changed_when: false

    - name: Get latest Helm release info from GitHub API
      ansible.builtin.uri:
        url: https://api.github.com/repos/helm/helm/releases/latest
        method: GET
        return_content: true
      register: rancherk8s_helm_latest_release
      when:
        - rancherk8s_helm_version_check.rc != 0
        - rancherk8s_helm_version | length == 0

    - name: Set Helm version variable
      ansible.builtin.set_fact:
        rancherk8s_helm_target_version: >-
          {{ rancherk8s_helm_version if rancherk8s_helm_version | length > 0
             else rancherk8s_helm_latest_release.json.tag_name }}
      when: rancherk8s_helm_version_check.rc != 0

    - name: Create temporary directory for Helm installation
      ansible.builtin.tempfile:
        state: directory
        suffix: helm
      register: rancherk8s_helm_temp_dir
      when: rancherk8s_helm_version_check.rc != 0

    - name: Download Helm installation script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: "{{ rancherk8s_helm_temp_dir.path }}/get_helm.sh"
        mode: '0755'
      when: rancherk8s_helm_version_check.rc != 0

    - name: Install Helm using official script # noqa no-changed-when
      ansible.builtin.command: "{{ rancherk8s_helm_temp_dir.path }}/get_helm.sh"
      environment:
        DESIRED_VERSION: "{{ rancherk8s_helm_target_version }}"
        HELM_INSTALL_DIR: "/usr/local/bin"
      become: true
      when: rancherk8s_helm_version_check.rc != 0

    - name: Clean up temporary directory
      ansible.builtin.file:
        path: "{{ rancherk8s_helm_temp_dir.path }}"
        state: absent
      when: rancherk8s_helm_version_check.rc != 0

    - name: Verify Helm installation
      ansible.builtin.command: helm version --short
      register: rancherk8s_helm_verify
      changed_when: false
