---
# rancherk8s_active_node: real target node - inventory_hostname stays on the driver when delegated.
- name: Resolve the node actually being acted on
  ansible.builtin.set_fact:
    rancherk8s_active_node: "{{ rancherk8s_upgrade_target | default(inventory_hostname) }}"

- name: 'Create /etc/rancher/{{ rancherk8s_type }}'
  ansible.builtin.file:
    state: directory
    path: '/etc/rancher/{{ rancherk8s_type }}'
    mode: '0755'

- name: 'Set config-file for {{ rancherk8s_type }}'
  ansible.builtin.template:
    src: config.yml.j2
    dest: '/etc/rancher/{{ rancherk8s_type }}/config.yaml'
    mode: '0644'
  no_log: true  # contains the join token and, optionally, S3 backup credentials
  notify: Restart server
