---
- name: Create /etc/rancher/rke2
  ansible.builtin.file:
    state: directory
    path: '/etc/rancher/rke2'
    mode: '0755'

- name: Set RKE2 config-file
  ansible.builtin.template:
    src: rke2_config.yml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: '0644'
  notify: Restart RKE2 server
