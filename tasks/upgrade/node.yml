---
- name: Resolve the node's hostname and local kubeconfig path
  ansible.builtin.set_fact:
    rancherk8s_upgrade_node_name: "{{ hostvars[rancherk8s_upgrade_target].ansible_facts.hostname }}"
    rancherk8s_upgrade_local_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/{{ rancherk8s_kubeconfig_name }}.yml"

- name: 'Resolve the service name to restart: "k3s" for a k3s server, else "<type>-<node_type>"'
  ansible.builtin.set_fact:
    rancherk8s_service_name: >-
      {{ 'k3s' if rancherk8s_type == 'k3s' and hostvars[rancherk8s_upgrade_target].rancherk8s_node_type == 'server'
         else rancherk8s_type + '-' + hostvars[rancherk8s_upgrade_target].rancherk8s_node_type }}

- name: "Install the server upgrade on {{ rancherk8s_upgrade_node_name }}"
  ansible.builtin.include_tasks: install/server.yml
  when: hostvars[rancherk8s_upgrade_target].rancherk8s_node_type == 'server'

- name: "Install the agent upgrade on {{ rancherk8s_upgrade_node_name }}"
  ansible.builtin.include_tasks: install/agent.yml
  when: hostvars[rancherk8s_upgrade_target].rancherk8s_node_type != 'server'

- name: Restart the service to apply the upgrade
  ansible.builtin.service:
    name: "{{ rancherk8s_service_name }}"
    state: restarted
  delegate_to: "{{ rancherk8s_upgrade_target }}"

- name: "Wait for Ready: {{ rancherk8s_upgrade_node_name }}"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    name: "{{ rancherk8s_upgrade_node_name }}"
    kubeconfig: "{{ rancherk8s_upgrade_local_kubeconfig }}"
  register: rancherk8s_node_status
  until: >-
    rancherk8s_node_status.resources | length > 0 and
    (rancherk8s_node_status.resources[0].status.conditions
      | selectattr('type', 'equalto', 'Ready')
      | map(attribute='status') | first) == 'True'
  retries: 60
  delay: 5
  delegate_to: localhost
