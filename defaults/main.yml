---
# defaults file for rke2

# versions
rancherk8s_version: 'v1.34.1+rke2r1'
rancherk8s_cni_cilium_version: '1.18.7'

# Helm version to install (e.g. 'v3.16.4'). Leave empty to install the latest release.
rancherk8s_helm_version: ''

# k9s version to install (e.g. 'v0.40.5'). Leave empty to install the latest release.
rancherk8s_k9s_version: 'v0.40.5'

rancherk8s_cni_cilium_autoupgrade: false

rancherk8s_node_type: server
rancherk8s_service_account: admin

rancherk8s_kubeconfig: "/etc/rancher/{{ rancherk8s_type }}/{{ rancherk8s_type }}.yaml"
rancherk8s_fetch_kubeconfig: true

rancherk8s_version_installed: "{{ rancherk8s_version }}"
rancherk8s_version_defined: "{{ rancherk8s_version }}"
rancherk8s_major_version: "{{ rancherk8s_version | regex_replace('^v(\\d+\\.\\d+).*', '\\1') }}"

rancherk8s_artifact_path: /tmp/

## Pre-flight resource requirements
rancherk8s_min_cpu_cores: 2
rancherk8s_min_memory_mb: 4096
# Allowed shortfall below rancherk8s_min_memory_mb, as a percentage. Guests
# report less than their configured RAM (kernel/firmware overhead, e.g.
# crashkernel reservations), so a strict >= check fails on correctly sized
# nodes. Set to 0 to require the full amount with no slack.
rancherk8s_min_memory_margin_percent: 20

## High availability - control-plane API endpoint
# VIP/LB address for the control-plane API. Required for >1 server (added
# to tls-san); empty falls back to server_primary's own address.
rancherk8s_api_endpoint: ''

# Manage rancherk8s_api_endpoint as a kube-vip VIP instead of an external LB.
rancherk8s_api_vip_enabled: false
rancherk8s_api_vip_version: 'v1.2.2'
# NIC kube-vip binds to on every control-plane node (assumes identical naming).
rancherk8s_api_vip_interface: "{{ hostvars[groups['server_primary'][0]].ansible_default_ipv4.interface }}"

## Timings and resources

# # Timings, fill in in seconds
# # Defaults are based on 'Medium Update and Average Reaction'
# # https://github.com/kubernetes-sigs/kubespray/blob/master/docs/kubernetes-reliability.md
# default_not_ready_toleration_seconds: 60
# default_unreachable_toleration_seconds: 60
# node_monitor_period: 5
# node_monitor_grace_period: 120
# node_status_update_frequency: 20


rancherk8s_limited_resources:
  - kube-apiserver-cpu=500m
  - kube-apiserver-memory=512M
  - kube-scheduler-cpu=250m
  - kube-scheduler-memory=512M
  - etcd-cpu=250m

## Firewall
# Disable firewalld/ufw: they conflict with CNI/kube-proxy-replacement
# iptables rules. Set false if you manage the OS firewall yourself.
rancherk8s_manage_firewalld: true

## Storage
# Path on the server node where the built-in local-path-provisioner stores
# PV data for the default 'local-path' StorageClass. Empty leaves it unset,
# falling back to the upstream k3s/rke2 default.
rancherk8s_default_local_storage_path: ''

# Disables k3s's built-in local-path-provisioner ('local-storage' addon);
# Flux provides it instead. No-op on rke2, which doesn't bundle this addon.
rancherk8s_local_storage_provisioner_enabled: false

## Networking - CNI - Cilium
rancherk8s_cni: cilium
rancherk8s_cni_l2_enabled: true

rancherk8s_cni_operator_replicas: 1

rancherk8s_cni_gateway: true

# rancherk8s_dualstack: false # allow ipv6

## Upgrades and backups

rancherk8s_allow_upgrade: true
# rancherk8s_auto_upgrade: false
# rancherk8s_auto_upgrade_grace_period: 45

# Cordon + drain a node before upgrading it, uncordon once it reports Ready
# again. Seconds to wait for pods to evict before the drain fails.
rancherk8s_upgrade_drain_timeout: 300
# How many agents to upgrade concurrently. Servers always upgrade one at a
# time regardless of this setting (etcd quorum safety).
rancherk8s_upgrade_agent_throttle: 1

rancherk8s_backup_schedule: "0 8,20 * * *"
rancherk8s_backup_retention: "14"

# Offsite etcd snapshots (S3-compatible); local-only when disabled - risky
# once quorum spans multiple servers. Credentials: vault-encrypted inventory.
rancherk8s_backup_s3_enabled: false
rancherk8s_backup_s3_endpoint: ''
rancherk8s_backup_s3_bucket: ''
rancherk8s_backup_s3_region: ''
rancherk8s_backup_s3_folder: ''
rancherk8s_backup_s3_access_key: ''
rancherk8s_backup_s3_secret_key: ''

## Tooling like Flux
rancherk8s_install_tools: true

rancherk8s_flux_bootstrap: true
rancherk8s_flux_interval: '5m'
rancherk8s_flux_bootstrap_provider: 'github'
rancherk8s_flux_bootstrap_token:
rancherk8s_flux_bootstrap_owner:
rancherk8s_flux_bootstrap_repo: 'fleet-infra'
rancherk8s_flux_bootstrap_branch: 'main'
rancherk8s_flux_bootstrap_path: './clusters/my-cluster'
rancherk8s_flux_bootstrap_type: 'personal'

# Install a SOPS age key into the cluster so Flux's kustomize-controller can
# decrypt SOPS-encrypted manifests. The key is read from the control machine
# (not stored in inventory) and pushed into a Secret, equivalent to:
#   cat <path> | kubectl create secret generic <name> -n <namespace> \
#     --from-file=age.agekey=/dev/stdin
rancherk8s_flux_sops_age_key_enabled: false
rancherk8s_flux_sops_age_key_path: '~/.config/sops/age/keys.txt'
rancherk8s_flux_sops_age_key_namespace: 'flux-system'
rancherk8s_flux_sops_age_key_secret_name: 'sops-age'
